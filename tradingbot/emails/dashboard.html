<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HA/ALMA Bot Dashboard</title>
<style>
  :root {
    --bg: #0f1420; --panel: #161d2e; --border: #263047;
    --text: #e7ecf5; --muted: #8a93a8;
    --green: #35d68a; --red: #ff5c72; --amber: #f5b942; --blue: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row .label { color: var(--muted); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge.IDLE { background: #2a3350; color: var(--muted); }
  .badge.ENTRIES_PLACED { background: #3a3010; color: var(--amber); }
  .badge.IN_POSITION { background: #10321f; color: var(--green); }
  .dir-LONG { color: var(--green); font-weight: 600; }
  .dir-SHORT { color: var(--red); font-weight: 600; }
  .pnl-pos { color: var(--green); }
  .pnl-neg { color: var(--red); }
  form .field { margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=number], input[type=text] {
    width: 100%; padding: 8px 10px; background: #0d1220; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; font-size: 14px;
  }
  input[type=checkbox] { transform: scale(1.2); margin-right: 6px; }
  .checkbox-row { display: flex; align-items: center; font-size: 14px; }
  button {
    background: var(--blue); color: white; border: none; padding: 10px 18px;
    border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 10px; padding: 8px 10px; border-radius: 6px; display: none; }
  .msg.ok { display: block; background: #10321f; color: var(--green); }
  .msg.err { display: block; background: #3a1420; color: var(--red); }
  .locked-note { font-size: 12px; color: var(--amber); margin-top: -6px; margin-bottom: 12px; }
  #logbox {
    background: #0a0e18; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
    height: 220px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; color: #a9b4c9;
  }
  .stale { color: var(--red); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<h1>HA / ALMA / RSI / ATR Bot — Live Dashboard</h1>
<div class="sub" id="last-updated">Loading...</div>

<div class="grid">
  <div>
    <div class="panel" id="status-panel">
      <h2>Trade Status</h2>
      <div id="status-body">Loading…</div>
    </div>
    <div class="panel">
      <h2>Recent Log</h2>
      <div id="logbox">Loading…</div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>Settings</h2>
      <div id="locked-note" class="locked-note" style="display:none;">
        ⚠ Symbol / interval are locked while a trade is active — changes there only apply once the bot returns to IDLE.
      </div>
      <form id="config-form"></form>
      <button id="save-btn" type="button">Save Settings</button>
      <button id="reset-btn" type="button" style="background:#3a1420; margin-left:8px;">Reset to Defaults</button>
      <div id="save-msg" class="msg"></div>
    </div>
  </div>
</div>

<script>
const FIELD_META = {
  testnet:      { label: "Testnet mode",             type: "checkbox" },
  symbol:       { label: "Symbol",                    type: "text" },
  interval:     { label: "Interval",                  type: "text" },
  leverage:     { label: "Leverage",                  type: "number", step: 1 },
  margin_fraction_per_entry: { label: "Margin fraction per entry (aligned with trend)", type: "number", step: 0.01 },
  margin_fraction_counter_trend: { label: "Margin fraction per entry (against trend)", type: "number", step: 0.01 },
  trend_sma_period: { label: "Trend SMA period (real close)", type: "number", step: 1 },
  alma_window:  { label: "ALMA window",               type: "number", step: 1 },
  rsi_period:   { label: "RSI period",                type: "number", step: 1 },
  rsi_sma_period: { label: "SMA of RSI period",       type: "number", step: 1 },
  atr_period:   { label: "ATR period",                type: "number", step: 1 },
  sl_atr_multiple: { label: "Initial SL (x ATR)",     type: "number", step: 0.1 },
  tp_custom_levels: { label: "TP levels (x ATR, comma-separated, e.g. 0.75,1.5,2.5)", type: "text" },
  tp_step_atr:  { label: "TP step after custom levels end (x ATR)", type: "number", step: 0.1 },
  tp_close_fraction: { label: "Each TP closes this fraction of remainder (0-1)", type: "number", step: 0.05 },
  sl_trail_gap_atr: { label: "SL trailing gap behind each TP (x ATR, from TP2 onward)", type: "number", step: 0.1 },
  adx_filter_enabled: { label: "ADX trend-strength filter (optional)", type: "checkbox" },
  adx_period:   { label: "ADX period",                type: "number", step: 1 },
  adx_threshold: { label: "ADX threshold (min strength to allow entry)", type: "number", step: 1 },
  poll_seconds: { label: "Poll interval (seconds)",   type: "number", step: 1 },
  klines_lookback: { label: "Candle history lookback", type: "number", step: 1 },
  telegram_enabled: { label: "Telegram notifications", type: "checkbox" },
};

let currentConfig = {};
let currentLimits = {};
let botIsIdle = true;

function fmt(n, digits = 2) {
  if (n === null || n === undefined) return "—";
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

// If this page was opened with ?token=... in the URL (see DASHBOARD_TOKEN in
// dashboard_server.py), forward it on every API call automatically so the person
// doesn't have to re-enter it per-request.
const urlToken = new URLSearchParams(window.location.search).get('token');
function apiFetch(path, options = {}) {
  const url = urlToken ? `${path}${path.includes('?') ? '&' : '?'}token=${encodeURIComponent(urlToken)}` : path;
  return fetch(url, options);
}

async function refreshStatus() {
  try {
    const res = await apiFetch('/api/status');
    const data = await res.json();
    const s = data.live_status || {};
    const status = s.bot_status || "UNKNOWN";
    botIsIdle = status === "IDLE";
    if (s.symbol) document.title = `${s.symbol} Bot Dashboard`;

    const pnl = s.unrealized_pnl;
    const pnlClass = pnl > 0 ? "pnl-pos" : (pnl < 0 ? "pnl-neg" : "");
    const dirClass = s.direction === "LONG" ? "dir-LONG" : (s.direction === "SHORT" ? "dir-SHORT" : "");

    document.getElementById("status-body").innerHTML = `
      <div class="row"><span class="label">Status</span><span class="badge ${status}">${status}</span></div>
      <div class="row"><span class="label">Direction</span><span class="${dirClass}">${s.direction || "—"}</span></div>
      <div class="row"><span class="label">TP level hit</span><span>${s.tp_level ?? 0}</span></div>
      <div class="row"><span class="label">Symbol / Interval</span><span>${s.symbol || "—"} / ${s.interval || "—"}</span></div>
      <div class="row"><span class="label">Leverage</span><span>${s.leverage ?? "—"}x</span></div>
      <div class="row"><span class="label">Position size</span><span>${fmt(s.position_amt, 6)}</span></div>
      <div class="row"><span class="label">Entry price</span><span>${fmt(s.entry_price)}</span></div>
      <div class="row"><span class="label">Mark price</span><span>${fmt(s.mark_price)}</span></div>
      <div class="row"><span class="label">Unrealized PnL</span><span class="${pnlClass}">${s.unrealized_pnl != null ? fmt(s.unrealized_pnl) + " USDT" : "—"}</span></div>
      <div class="row"><span class="label">Available balance</span><span>${fmt(s.available_balance)} USDT</span></div>
      <div class="row"><span class="label">Stop-loss</span><span>${fmt(s.sl_price)} (qty ${fmt(s.sl_qty, 6)})</span></div>
      <div class="row"><span class="label">Next take-profit</span><span>${fmt(s.tp_price)} (qty ${fmt(s.tp_qty, 6)})</span></div>
      <div class="row"><span class="label">ATR at signal</span><span>${fmt(s.atr_at_signal)}</span></div>
      <div class="row"><span class="label">Current ADX</span><span>${fmt(s.current_adx, 1)} ${s.adx_filter_enabled ? `(filter ON, needs ≥${s.adx_threshold})` : "(filter off - informational only)"}</span></div>
    `;

    document.getElementById("logbox").textContent = (data.logs || []).join("\n") || "(no log entries yet)";
    const logbox = document.getElementById("logbox");
    logbox.scrollTop = logbox.scrollHeight;

    const ts = s.timestamp ? new Date(s.timestamp * 1000) : null;
    const ageSec = ts ? Math.round((Date.now() - ts.getTime()) / 1000) : null;
    let updatedText = ts ? `Last updated: ${ts.toLocaleTimeString()}` : "No status file yet — is bot.py running?";
    document.getElementById("last-updated").innerHTML = updatedText +
      (ageSec !== null && ageSec > 120 ? `<span class="stale"> — stale (${ageSec}s old, bot may not be running)</span>` : "");

    document.getElementById("locked-note").style.display = botIsIdle ? "none" : "block";
  } catch (e) {
    document.getElementById("last-updated").innerHTML = `<span class="stale">Could not reach dashboard server</span>`;
  }
}

function buildForm() {
  const form = document.getElementById("config-form");
  form.innerHTML = "";
  for (const [key, meta] of Object.entries(FIELD_META)) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const value = currentConfig[key];
    const locked = (key === "symbol" || key === "interval") && !botIsIdle;

    if (meta.type === "checkbox") {
      wrap.innerHTML = `
        <div class="checkbox-row">
          <input type="checkbox" id="f_${key}" ${value ? "checked" : ""} ${locked ? "disabled" : ""}>
          <label for="f_${key}" style="margin:0;">${meta.label}</label>
        </div>`;
    } else {
      const limit = currentLimits[key];
      const hint = limit ? ` (range ${limit[0]}–${limit[1]})` : "";
      wrap.innerHTML = `
        <label for="f_${key}">${meta.label}${hint}</label>
        <input type="${meta.type}" id="f_${key}" value="${value ?? ""}"
               ${meta.step ? `step="${meta.step}"` : ""} ${locked ? "disabled" : ""}>`;
    }
    form.appendChild(wrap);
  }
}

async function refreshConfig() {
  const res = await apiFetch('/api/config');
  const data = await res.json();
  currentConfig = data.config || {};
  currentLimits = data.limits || {};
  buildForm();
}

async function saveConfig() {
  const payload = {};
  for (const [key, meta] of Object.entries(FIELD_META)) {
    const el = document.getElementById(`f_${key}`);
    if (!el || el.disabled) continue;
    payload[key] = meta.type === "checkbox" ? el.checked : (meta.type === "number" ? Number(el.value) : el.value);
  }
  const btn = document.getElementById("save-btn");
  btn.disabled = true;
  try {
    const res = await apiFetch('/api/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    const msg = document.getElementById("save-msg");
    if (data.warnings && data.warnings.length) {
      msg.className = "msg err";
      msg.textContent = "Saved with warnings: " + data.warnings.join("; ");
    } else {
      msg.className = "msg ok";
      msg.textContent = "Settings saved. Takes effect within one poll cycle (bot re-reads config.json every tick).";
    }
    currentConfig = data.config;
    buildForm();
  } catch (e) {
    const msg = document.getElementById("save-msg");
    msg.className = "msg err";
    msg.textContent = "Could not save — is the dashboard server running?";
  }
  btn.disabled = false;
}

document.getElementById("save-btn").addEventListener("click", saveConfig);

async function resetToDefaults() {
  const confirmed = window.confirm(
    "Reset ALL settings to their code defaults? This overwrites your current " +
    "leverage, margin fractions, indicator periods, TP ladder, SL settings, ADX, " +
    "poll interval, and Telegram toggle. Symbol and interval are NOT affected. " +
    "This cannot be undone from here. Continue?"
  );
  if (!confirmed) return;

  const btn = document.getElementById("reset-btn");
  btn.disabled = true;
  try {
    const res = await apiFetch('/api/reset-defaults', { method: 'POST' });
    const data = await res.json();
    const msg = document.getElementById("save-msg");
    if (data.reset) {
      msg.className = "msg ok";
      msg.textContent = "All settings reset to defaults (symbol/interval unchanged). " +
        "Takes effect within one poll cycle.";
      currentConfig = data.config;
      buildForm();
    } else {
      msg.className = "msg err";
      msg.textContent = "Reset failed: " + (data.error || "unknown error");
    }
  } catch (e) {
    const msg = document.getElementById("save-msg");
    msg.className = "msg err";
    msg.textContent = "Could not reset — is the dashboard server running?";
  }
  btn.disabled = false;
}

document.getElementById("reset-btn").addEventListener("click", resetToDefaults);

async function init() {
  await refreshStatus();
  await refreshConfig();
  setInterval(refreshStatus, 5000);
}
init();
</script>
</body>
</html>
